<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데일리 스트레칭</title>
<style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #E1F5FE; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; color: #333; }
    h1 { color: #0277BD; margin-bottom: 30px; }
    #home, #stretching { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 400px; background: white; padding: 30px 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .body-map { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 10px; }
    .row { display: flex; gap: 15px; }
    .btn { background-color: #A5D6A7; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; font-weight: bold; color: #1B5E20; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn:hover { background-color: #81C784; transform: scale(1.05); }
    #stretching { display: none; text-align: center; }
    .emoji { font-size: 90px; margin: 20px 0; }
    .desc { font-size: 18px; margin-bottom: 8px; line-height: 1.5; color: #444; font-weight: bold; }
    .timer { font-size: 60px; font-weight: bold; color: #0288D1; margin: 30px 0; transition: all 0.3s ease; }
    .timer.alert { font-size: 90px; color: #D32F2F; }
    .cumulative { font-size: 20px; font-weight: bold; color: #2E7D32; margin-top: 30px; padding: 10px 20px; background-color: #E8F5E9; border-radius: 10px; }
</style>
</head>
<body>

<h1>데일리 스트레칭</h1>

<div id="home">
    <p style="font-size: 18px; color: #555; margin-bottom: 20px;">풀어줄 부위를 선택하세요.</p>
    <div class="body-map">
        <button class="btn" onclick="startRoutine('neck')">목</button>
        <button class="btn" onclick="startRoutine('shoulder')">어깨</button>
        <button class="btn" onclick="startRoutine('waist')">허리</button>
        <div class="row">
            <button class="btn" onclick="startRoutine('thigh')">허벅지</button>
            <button class="btn" onclick="startRoutine('calf')">종아리</button>
        </div>
    </div>
    <div class="cumulative" id="totalTimeDisplay">오늘 누적 시간: 0분 0초</div>
</div>

<div id="stretching">
    <div class="emoji" id="s_emoji">🧘</div>
    <div class="desc" id="s_desc1">설명 1</div>
    <div class="desc" id="s_desc2">설명 2</div>
    <div class="timer" id="s_timer">30</div>
</div>

<script>
    const routines = {
        neck: [
            { emoji: "💆", desc1: "오른손으로 왼쪽 머리를 잡고", desc2: "오른쪽으로 지그시 당겨주세요." },
            { emoji: "💆‍♀️", desc1: "왼손으로 오른쪽 머리를 잡고", desc2: "왼쪽으로 지그시 당겨주세요." },
            { emoji: "🙆", desc1: "양손을 깍지 끼고 뒤통수에 댄 후", desc2: "고개를 아래로 꾹 눌러주세요." }
        ],
        shoulder: [
            { emoji: "🤷", desc1: "양쪽 어깨를 귀 쪽으로 으쓱 올린 후", desc2: "천천히 아래로 툭 떨어뜨리세요." },
            { emoji: "🙅", desc1: "오른팔을 뻗어 왼쪽으로 보내고", desc2: "왼팔로 걸어 가슴 쪽으로 당기세요." },
            { emoji: "🙅‍♀️", desc1: "왼팔을 뻗어 오른쪽으로 보내고", desc2: "오른팔로 걸어 가슴 쪽으로 당기세요." }
        ],
        waist: [
            { emoji: "🧍", desc1: "양손을 허리에 짚고 서서", desc2: "골반을 크게 천천히 돌려주세요." },
            { emoji: "🤸", desc1: "오른손을 위로 뻗고", desc2: "왼쪽으로 상체를 기울여 옆구리를 늘리세요." },
            { emoji: "🤸‍♀️", desc1: "왼손을 위로 뻗고", desc2: "오른쪽으로 상체를 기울여 옆구리를 늘리세요." }
        ],
        thigh: [
            { emoji: "🦵", desc1: "오른쪽 발목을 뒤로 잡고", desc2: "엉덩이 쪽으로 당겨 앞 허벅지를 늘리세요." },
            { emoji: "🦵", desc1: "왼쪽 발목을 뒤로 잡고", desc2: "엉덩이 쪽으로 당겨 앞 허벅지를 늘리세요." },
            { emoji: "🧘", desc1: "바닥에 앉아 양 발바닥을 붙이고", desc2: "상체를 앞으로 숙여 안쪽 허벅지를 늘리세요." }
        ],
        calf: [
            { emoji: "🚶", desc1: "벽을 짚고 오른발을 뒤로 뻗어", desc2: "발뒤꿈치를 바닥에 꾹 눌러주세요." },
            { emoji: "🚶", desc1: "벽을 짚고 왼발을 뒤로 뻗어", desc2: "발뒤꿈치를 바닥에 꾹 눌러주세요." },
            { emoji: "🧎", desc1: "자리에 앉아 두 다리를 뻗고", desc2: "발끝을 몸쪽으로 강하게 당겨주세요." }
        ]
    };

    let totalSeconds = 0;
    let currentRoutine = [];
    let step = 0;
    let timeLeft = 30;
    let timerInterval;

    function startRoutine(part) {
        currentRoutine = routines[part];
        step = 0;
        document.getElementById('home').style.display = 'none';
        document.getElementById('stretching').style.display = 'flex';
        showStep();
    }

    function showStep() {
        if (step >= 3) {
            finishRoutine();
            return;
        }
        
        let current = currentRoutine[step];
        document.getElementById('s_emoji').innerText = current.emoji;
        document.getElementById('s_desc1').innerText = current.desc1;
        document.getElementById('s_desc2').innerText = current.desc2;
        
        timeLeft = 30;
        updateTimerDisplay();
        
        timerInterval = setInterval(() => {
            timeLeft--;
            totalSeconds++;
            updateTimerDisplay();
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                step++;
                document.getElementById('s_timer').classList.remove('alert');
                showStep();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const timerEl = document.getElementById('s_timer');
        timerEl.innerText = timeLeft;
        if (timeLeft <= 5 && timeLeft > 0) {
            timerEl.classList.add('alert');
        } else {
            timerEl.classList.remove('alert');
        }
    }

    function finishRoutine() {
        document.getElementById('stretching').style.display = 'none';
        document.getElementById('home').style.display = 'flex';
        
        let minutes = Math.floor(totalSeconds / 60);
        let seconds = totalSeconds % 60;
        document.getElementById('totalTimeDisplay').innerText = `오늘 누적 시간: ${minutes}분 ${seconds}초`;
    }
</script>

</body>
</html>
